spring:
  application:
    name: servico-auditor-dlq
  datasource:
    url: jdbc:h2:mem:auditoria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local}

app:
  dlq:
    name: ${DLQ_NAME:T0XN_seu_nome_original_DLQ}
